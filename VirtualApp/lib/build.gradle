plugins {
    id 'com.android.library'
}

android {
    namespace 'com.lody.virtual'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        // NDK r27 requires API 21+
        minSdk 21
        targetSdk 28
        externalNativeBuild {
            ndkBuild {
                // P1: 64-bit host (target apps such as bindu ship arm64-v8a only)
                abiFilters "arm64-v8a"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path file("src/main/jni/Android.mk")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
        aidl true
    }
    lint {
        // IJobService needs NewApi
        warning 'NewApi', 'OnClick'
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Android 9+ hidden API exemption (Apache-2.0). Without it most framework mirrors resolve to null.
    api 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
