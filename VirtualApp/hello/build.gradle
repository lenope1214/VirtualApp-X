plugins {
    id 'com.android.application'
}

// Tiny target app used to validate the sandbox before trying real apps (bindu).
android {
    namespace 'io.vax.hello'
    compileSdk 35

    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId "io.vax.hello"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    // Native probe (probe.c) calls dlopen() directly, which Java System.load does not (it uses
    // android_dlopen_ext). Used to verify guest dlopen redirection.
    externalNativeBuild {
        ndkBuild {
            path file("src/main/jni/Android.mk")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
